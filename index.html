<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hiệu ứng nền -->
    <div class="background"></div>

    <!-- MENU 1 -->
    <section id="screen1" class="screen active">
        <div class="card">
            <div class="emoji-big">🎉</div>

            <h1>Hello!</h1>

            <p>
                Có một điều đặc biệt<br>
                đang chờ bạn phía trước...
            </p>

            <button onclick="nextScreen(2)">
                Tiếp Tục
                <span>→</span>
            </button>
        </div>
    </section>


    <!-- MENU 2 -->
    <section id="screen2" class="screen">
        <div class="card">
            <div class="emoji-big">😁</div>

            <h2>Thông tin quan trọng</h2>

            <p class="subtext">
                Hãy điền thông tin của bạn nhé!
            </p>

            <div class="input-group">
                <label>Tên</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Nhập tên..."
                >
            </div>

            <div class="input-group">
                <label>Ngày sinh</label>
                <input
                    type="date"
                    id="birthday"
                >
            </div>

            <button onclick="showBirthday()">
                Tiếp Tục
                <span>→</span>
            </button>

            <p id="error" class="error"></p>
        </div>
    </section>


    <!-- MENU 3 -->
    <section id="screen3" class="screen">
        <div id="rain-container"></div>

        <div class="birthday-content">
            <div class="cake">🎂</div>

            <h1>
                Chúc mừng sinh nhật
            </h1>

            <h2 id="birthdayName">
                Bạn!
            </h2>

            <p>
                🎉 Chúc bạn có một sinh nhật thật vui vẻ! 🎉
            </p>

            <p>
                Mong mọi điều tốt đẹp nhất<br>
                sẽ đến với bạn 💖
            </p>

            <div class="heart">❤️</div>
        </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
