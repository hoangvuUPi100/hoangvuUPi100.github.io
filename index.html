<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GiftOS</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Floating Hearts -->

    <div id="hearts"></div>

    <!-- Lock Screen -->

    <section id="lockscreen">

        <div class="clock">

            <h1 id="time">00:00</h1>

            <p id="date">Wednesday</p>

        </div>

        <div class="swipe">

            ↑ Vuốt lên để mở khóa

        </div>

    </section>

    <!-- Passcode -->

    <section id="passcode">

        <div class="pin">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

        <p id="status">

            Nhập mật khẩu

        </p>

        <div class="keypad">

            <button data-value="1">1</button>
            <button>2</button>
            <button>3</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>

            <button class="empty"></button>

            <button>0</button>

            <button id="delete">⌫</button>

        </div>

    </section>

    <!-- Desktop -->

    <section id="desktop">

        <div class="dock">

            <div class="app">

                🎵

                <span>Music</span>

            </div>

            <div class="app">

                💌

                <span>Letter</span>

            </div>

            <div class="app">

                📷

                <span>Gallery</span>

            </div>

            <div class="app">

                🎁

                <span>Gift</span>

            </div>

            <div class="app">

                🎮

                <span>Game</span>

            </div>

            <div class="app">

                🌙

                <span>Theme</span>

            </div>

            <div class="app">

                ⚙

                <span>Settings</span>

            </div>

        </div>

    </section>

    <script src="js/lockscreen.js"></script>

</body>

</html>
