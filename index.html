<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Chứng Khoán</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📈 Mô Phỏng Chứng Khoán</h1>

    <div class="money-box">
      <h2>Số dư: <span id="money">10000</span>$</h2>
      <h2>Cổ phiếu: <span id="shares">0</span></h2>
    </div>

    <div class="stock-card">
      <h2>Giá cổ phiếu</h2>
      <div id="price" class="price">100$</div>
      <div id="trend" class="trend">Đang cập nhật...</div>
    </div>

    <div class="buttons">
      <button onclick="buyStock()">Mua</button>
      <button onclick="sellStock()">Bán</button>
    </div>

    <div class="history-box">
      <h2>Lịch sử</h2>
      <ul id="history"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
